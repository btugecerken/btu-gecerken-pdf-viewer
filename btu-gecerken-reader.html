<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BTÜ Geçerken | PDF Okuyucusu</title>

  <link rel="icon" href="https://btugecerken.com/logogecerken-Photoroom%20(1).ico">

  <!-- Fontlar & İkonlar -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Serif+TR:wght@300;400;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- PDF.js ve PDF-Lib (Çizimli İndirme İçin) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  
  <link rel="stylesheet" href="btu-gecerken-reader.css">
</head>
<body>

  <div class="pdf-app-wrapper">
    <!-- Üst Kontrol Barı -->
    <header class="pdf-toolbar">
      <div class="toolbar-left">
        <button id="btnOpenLibrary" class="btn-tool" title="Kütüphaneye Dön">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <span class="doc-title" id="docTitle">PDF Yükleniyor...</span>
      </div>

      <div class="toolbar-center desktop-nav">
        <button id="prevPageDesktop" class="btn-tool" title="Önceki Sayfa"><i class="fa-solid fa-chevron-left"></i></button>
        <span class="page-info">Sayfa <span id="pageNum">1</span> / <span id="pageCount">--</span></span>
        <button id="nextPageDesktop" class="btn-tool" title="Sonraki Sayfa"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <div class="toolbar-right desktop-actions">
        <button id="zoomOutDesktop" class="btn-tool" title="Uzaklaştır"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button id="zoomInDesktop" class="btn-tool" title="Yakınlaştır"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button id="penToggleDesktop" class="btn-tool" title="Çizim Araçları"><i class="fa-solid fa-pen"></i></button>
        <button id="btnDownloadAnnotatedDesktop" class="btn-tool" title="Çizimlerle İndir"><i class="fa-solid fa-file-arrow-down"></i></button>
        <button id="toggleAiDrawerDesktop" class="btn-ai-trigger">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>Dergilik Asistanı</span>
        </button>
      </div>
    </header>

    <!-- Ana Çalışma Alanı -->
    <main class="pdf-main-viewport">
      <!-- Açılır Çizim Araç Çubuğu (Floating Pen Toolbar) -->
      <div class="pen-floating-toolbar" id="penToolbar">
        <div class="pen-tool-row">
          <button class="pen-mode-btn active" data-mode="pen" title="Normal Kalem"><i class="fa-solid fa-pen-nib"></i></button>
          <button class="pen-mode-btn" data-mode="highlighter" title="Fosforlu Kalem"><i class="fa-solid fa-highlighter"></i></button>
          <button class="pen-mode-btn" data-mode="eraser" title="Silgi"><i class="fa-solid fa-eraser"></i></button>
          <div class="p-divider"></div>
          <button class="pen-action-btn" id="btnUndoStroke" title="Geri Al"><i class="fa-solid fa-rotate-left"></i></button>
          <button class="pen-action-btn" id="btnClearPageDraw" title="Sayfayı Temizle"><i class="fa-solid fa-trash-can"></i></button>
        </div>
        <div class="pen-tool-row sub-row">
          <!-- Renk Paleti -->
          <div class="pen-colors">
            <span class="color-dot active" data-color="#009B77" style="background:#009B77;"></span>
            <span class="color-dot" data-color="#002366" style="background:#002366;"></span>
            <span class="color-dot" data-color="#ef4444" style="background:#ef4444;"></span>
            <span class="color-dot" data-color="#111a16" style="background:#111a16;"></span>
          </div>
          <div class="p-divider"></div>
          <!-- Kalınlıklar -->
          <div class="pen-sizes">
            <button class="size-btn active" data-size="2">İnce</button>
            <button class="size-btn" data-size="5">Orta</button>
            <button class="size-btn" data-size="10">Kalın</button>
          </div>
        </div>
      </div>

      <div class="pdf-canvas-container" id="canvasContainer">
        <div class="page-viewport-box" id="pageBox">
          <canvas id="pdfCanvas"></canvas>
          <canvas id="drawCanvas"></canvas>
        </div>
      </div>

      <!-- Dergilik AI Çekmecesi -->
      <aside class="pdf-ai-drawer" id="pdfAiDrawer">
        <div class="drawer-header">
          <div class="drawer-brand">
            <img src="https://btugecerken.com/logogecerken-Photoroom%20(1).ico" alt="BTÜ Geçerken">
            <div>
              <h4>Dergilik Asistanı</h4>
              <span class="sub-badge">Powered by BTÜ Geçerken AI</span>
            </div>
          </div>
          <button id="closeAiDrawer" class="btn-close-drawer" title="Kapat"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="drawer-quick-actions">
          <button id="btnSummarizePage" class="btn-chip">
            <i class="fa-solid fa-bolt"></i> Bu Sayfayı Özetle
          </button>
          <button id="btnKeyTakeaways" class="btn-chip">
            <i class="fa-solid fa-list-check"></i> Önemli Notlar
          </button>
        </div>

        <div class="drawer-messages" id="drawerMessages">
          <div class="d-msg d-bot">
            Merhaba! Ben <strong>Dergilik Asistanı</strong>. Sayfa metnini inceleyebilir, hızlı özet çıkarabilir veya aklınıza takılan soruları yanıtlayabilirim.
          </div>
        </div>

        <div class="drawer-footer-wrapper">
          <form class="drawer-footer" id="drawerForm">
            <input type="text" id="drawerInput" placeholder="Bu sayfayla ilgili bir soru sor..." autocomplete="off">
            <button type="submit" aria-label="Gönder"><i class="fa-solid fa-paper-plane"></i></button>
          </form>
          <div class="ai-warning-text">Yapay zekâ modeli hata yapabilir. Önemli bilgileri kontrol ediniz.</div>
        </div>
      </aside>
    </main>

    <!-- Mobil / Dar Ekran Alt Bar -->
    <nav class="pdf-mobile-bottom-bar">
      <button id="prevPageMobile" class="btn-mob-tool" title="Önceki Sayfa"><i class="fa-solid fa-chevron-left"></i></button>

      <div class="mob-page-indicator">
        <span id="mobPageNum">1</span> / <span id="mobPageCount">--</span>
      </div>

      <button id="nextPageMobile" class="btn-mob-tool" title="Sonraki Sayfa"><i class="fa-solid fa-chevron-right"></i></button>

      <div class="mob-sep"></div>

      <button id="penToggleMobile" class="btn-mob-tool" title="Kalem"><i class="fa-solid fa-pen"></i></button>
      <button id="btnDownloadAnnotatedMobile" class="btn-mob-tool" title="İndir"><i class="fa-solid fa-file-arrow-down"></i></button>

      <button id="toggleAiDrawerMobile" class="btn-mob-ai" title="Asistan">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>Asistan</span>
      </button>
    </nav>
  </div>

  <script src="btu-gecerken-reader.js"></script>
</body>
</html>
